buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // lets mixin mods such as Curios and Fundamentum run in the dev environment
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            jvmArgs '-Xmx3G'
            args '-mixin.config=ostentum.mixins.json'
            // 1.20.1: no dev test clients (see PORTING.md); never run one in front of Oculifelis
        }
        server {
            args '--nogui', '-mixin.config=ostentum.mixins.json'
            // dev quick test only: SelfTest runs its checks once the server starts, then stops it
            property 'ostentum.selftest', 'true'
        }
    }
}

mixin {
    add sourceSets.main, 'ostentum.refmap.json'
    config 'ostentum.mixins.json'
}

repositories {
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'Patchouli (BlameJared)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'vazkii.patchouli' }
    }
    maven {
        name = 'Fundamentum (the shared core mod, local repo)'
        url = project.findProperty('fundamentum_repo') ?: 'file:///H:/AI_MC_Modding/Fundamentum/repo'
        content { includeGroup 'com.fundamentum' }
    }
}

// Ostentum shows off Fundamentum: mounts, summons, hooks, wings, moons and night events are Fundamentum's systems,
// filled in with vanilla-themed data. Curios is Fundamentum's required dependency, so dev runs load it too.
// Patchouli is optional (the guide book is data only); dev runs load it so the book's data is read.
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("com.fundamentum:fundamentum-forge:${fundamentum_version}")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            fundamentum_range      : fundamentum_range,
            // -Pnopendant holds the Record Pendant back (META-INF/ostentum-build.properties; its data is left out below)
            with_pendant           : !project.hasProperty('nopendant'),
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'META-INF/ostentum-build.properties']) {
        expand replaceProperties
    }
    // Weapon art still under review stays out of the jar (../pending-weapons.txt; one item id per line).
    def pending = rootProject.file('../pending-weapons.txt')
    if (pending.exists()) {
        pending.readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }.each { n ->
            exclude "assets/ostentum/**/${n}.*", "assets/ostentum/**/${n}_*"
        }
    }
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('..')) { include 'LICENSE', 'COPYING', 'CREDITS.md' }   // the licence texts and the credits
    manifest {
        attributes(['Specification-Title': mod_id, 'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion,
                    'MixinConfigs': 'ostentum.mixins.json'])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xmaxerrs" << "3000"
}

// -Pnopendant: ship without the Record Pendant. music/NowPlaying reads pendant=false from META-INF/ostentum-build.properties
// and registers no item (so no creative tab entry); its recipe, model, texture and Curios data stay out of the jar too.
tasks.named('processResources') {
    def noPendant = project.hasProperty('nopendant')
    inputs.property 'nopendant', noPendant
    if (noPendant) {
        exclude 'data/ostentum/recipes/record_pendant.json', 'data/curios/tags/items/necklace.json',
            'data/ostentum/curios/entities/record_pendant.json',
            'assets/ostentum/models/item/record_pendant.json', 'assets/ostentum/textures/item/record_pendant.png'
    }
}
